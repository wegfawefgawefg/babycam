<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babycam</title>
<style>
  :root { --bg: #000; --panel: #121212; --btn: #1e1e1e; --btn-on: #3a3220; --text: #c8c2b4; --dim: #7a756b; --accent: #e0b060; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.3 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000;
           overflow: hidden; touch-action: none; }
  #view { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
  #mstat { position: absolute; top: 28px; right: 28px; text-align: right; pointer-events: none; color: #c8c2b4; font-size: 15px; }
  #mstat canvas { display: block; margin-top: 2px; background: rgba(0,0,0,.45); border-radius: 4px; }
  video { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #overlay span { background: rgba(0,0,0,.7); border: 1px solid var(--dim); padding: 14px 22px; border-radius: 10px; font-size: 20px; }
  #msg { position: absolute; top: 8px; left: 10px; color: var(--dim); font-size: 13px; pointer-events: none; }
  #lag { position: absolute; top: 8px; right: 28px; color: var(--dim); font-size: 13px; pointer-events: none; }
  #msg { top: 30px !important; }
  #alarm { position: absolute; inset: 0; pointer-events: none; border: 0 solid transparent; }
  #alarm.nosignal { border: 12px solid #d42020; animation: blink 1s steps(2) infinite; }
  #alarm.sound { border: 10px solid #e08a00; }
  @keyframes blink { 50% { border-color: #5a0a0a; } }
  #banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 18px 30px; border-radius: 12px;
            font-size: 34px; font-weight: 700; display: none; pointer-events: none; text-align: center; color: #fff; }
  #banner small { display: block; font-size: 18px; font-weight: 400; margin-top: 6px; }
  #banner.nosignal { display: block; background: rgba(170, 0, 0, .88); }
  #banner.sound { display: block; background: rgba(205, 115, 0, .82); top: 14%; font-size: 26px; }
  #live { position: absolute; top: 8px; left: 10px; font-size: 13px; pointer-events: none; color: #4c4; }
  #live .warn { color: #fff; background: #b02020; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  #meter { position: absolute; right: 8px; top: 30px; bottom: 12px; width: 12px; background: #0c0c0c; border: 1px solid #333;
           border-radius: 4px; overflow: hidden; pointer-events: none; display: none; }
  #meterFill { position: absolute; bottom: 0; left: 0; right: 0; height: 0; background: #4c4; }
  #meterFloor, #meterTrig { position: absolute; left: 0; right: 0; height: 2px; }
  #meterFloor { background: #888; }
  #meterTrig { background: #e08a00; }
  #stat2 { width: 100%; text-align: center; color: var(--dim); font-size: 12px; }
  #stat2 .bad { color: #ff6050; font-weight: 700; }
  #bar { background: var(--panel); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .grp { display: flex; gap: 4px; align-items: center; padding: 0 6px; border-right: 1px solid #222; }
  .grp:last-child { border-right: none; }
  .lbl { color: var(--dim); font-size: 12px; margin-right: 2px; }
  button { background: var(--btn); color: var(--text); border: 1px solid #2a2a2a; border-radius: 8px; padding: 9px 12px; font-size: 15px; min-width: 44px; cursor: pointer; }
  button:hover, button:focus { border-color: var(--accent); outline: none; }
  button.on { background: var(--btn-on); color: var(--accent); border-color: #5a4a28; }
  #stat { width: 100%; text-align: center; color: var(--dim); font-size: 12px; }
  body.hide #bar { display: none; }
  /* TV mode: remote control, big focusable buttons */
  body.tv #bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px; background: rgba(10,10,10,.92); }
  body.tv #bar button { font-size: 24px; padding: 14px 20px; }
  body.tv #bar .lbl { font-size: 18px; }
  body.tv #bar button:focus { outline: 4px solid var(--accent); outline-offset: 2px; background: #3a3220; color: var(--accent); }
  body.tv #stat, body.tv #stat2 { font-size: 18px; }
  #tvhint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: var(--dim); font-size: 18px;
            pointer-events: none; display: none; }
  body.tv.hide #tvhint { display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="view">
    <video id="v" autoplay muted playsinline></video>
    <canvas id="mc" style="display:none; position:absolute;"></canvas>
  </div>
  <div id="mstat"><span id="mnum"></span><canvas id="mgraph" width="180" height="40"></canvas></div>
  <div id="overlay"><span>Tap for sound</span></div>
  <div id="tvhint">OK: menu &middot; CH+/CH&minus;: zoom &middot; arrows: look around &middot; red: motion &middot; green: camera &middot; yellow: sound mode &middot; volume: TV buttons</div>
  <div id="msg">connecting</div>
  <div id="lag"></div>
  <div id="alarm"></div>
  <div id="banner"></div>
  <div id="live"></div>
  <canvas id="wheel" width="64" height="64" title="Direction colors" style="display:none; position:absolute; left:12px; bottom:12px; pointer-events:none;"></canvas>
  <div id="meter" title="Sound level (grey: room background, orange: alert level)"><div id="meterFill"></div><div id="meterFloor"></div><div id="meterTrig"></div></div>
</div>
<div id="bar">
  <div class="grp"><span class="lbl">Camera</span>
    <button data-cam="4">IR</button><button data-cam="0">Main</button><button data-cam="2">Wide</button><button data-cam="3">Tele</button>
  </div>
  <div class="grp"><span class="lbl">View</span>
    <button data-c="zoomout">&minus;</button><button data-c="zoomin">+</button>
    <button data-c="nudge -0.25 0">&larr;</button><button data-c="nudge 0 -0.25">&uarr;</button>
    <button data-c="nudge 0 0.25">&darr;</button><button data-c="nudge 0.25 0">&rarr;</button>
    <button data-c="reset">Reset</button><button data-c="rotate">Rotate</button>
  </div>
  <div class="grp"><span class="lbl">Light</span>
    <button data-c="darker">Darker</button><button data-c="brighter">Brighter</button>
    <button id="mono" data-c="mono">B&amp;W</button>
    <button id="night" data-c="night" title="Allow long shutter (lower fps) in the dark">Night</button>
  </div>
  <div class="grp"><span class="lbl">Motion</span>
    <button id="motion" title="Off / red overlay / motion only / magnify small movements (breathing) / direction colors">Motion</button>
    <button id="msens-" title="Less sensitive / weaker magnify">&minus;</button><button id="msens+" title="More sensitive / stronger magnify">+</button>
  </div>
  <div class="grp"><span class="lbl">Sound</span>
    <button id="vol-" title="Quieter">&minus;</button><button id="volv" title="Volume boost">1x</button><button id="vol+" title="Louder (up to 64x)">+</button>
    <button id="amode" title="Always on, or silent until a sound (like a baby monitor)">Always on</button>
    <button id="asens" title="How loud above the room's background noise counts as a sound alert">Alert: medium</button>
  </div>
  <div class="grp"><span class="lbl">Mic</span>
    <button id="mic-" title="Less mic boost (on the phone, for every viewer)">&minus;</button><button id="micv" title="Mic boost on the phone">1x</button><button id="mic+" title="More mic boost: hear quiet sounds on every screen">+</button>
  </div>
  <div class="grp"><span class="lbl">Quality</span>
    <button id="q" title="Video bitrate: lower is lighter on the wifi">?</button>
  </div>
  <div class="grp"><span class="lbl">Phone</span>
    <button data-c="screen 0">Screen off</button><button data-c="screen 1">Screen on</button>
    <button id="hide">Hide</button>
  </div>
  <div id="stat"></div>
  <div id="stat2"></div>
</div>
<script>
const v = document.getElementById('v');
const msg = document.getElementById('msg');
const lagEl = document.getElementById('lag');
let st = {};

// ---- player: fetch-streamed fragmented MP4 into MediaSource, kept close to live ----
let session = 0;
// MediaSource on most browsers, ManagedMediaSource on iOS 17.1+, plain HLS on older iPhones.
const MSClass = window.ManagedMediaSource || window.MediaSource;
let usingHls = false, playError = '';
function playHls() {
  if (!v.canPlayType('application/vnd.apple.mpegurl')) {
    playError = "This browser can't play the stream. Open this page in Safari or Chrome.";
    return;
  }
  usingHls = true;
  if (!/live\.m3u8/.test(v.src)) { v.src = '/live.m3u8'; v.play().catch(() => {}); }
}
v.addEventListener('error', () => {
  if (usingHls) setTimeout(() => { v.src = '/live.m3u8?' + Date.now(); v.play().catch(() => {}); }, 2000);
});
async function play() {
  const my = ++session;
  try {
    const info = await (await fetch('/info', {cache: 'no-store'})).json();
    if (!info.up || !info.codec) throw new Error('phone not streaming');
    const type = `video/mp4; codecs="${info.codec}, mp4a.40.2"`;
    if (usingHls || !MSClass || !MSClass.isTypeSupported(type)) { msg.textContent = ''; return playHls(); }
    const ms = new MSClass();
    if (window.ManagedMediaSource && MSClass === window.ManagedMediaSource) v.disableRemotePlayback = true;
    v.src = URL.createObjectURL(ms);
    await new Promise(r => ms.addEventListener('sourceopen', r, {once: true}));
    const sb = ms.addSourceBuffer(type);
    const q = [];
    const pump = () => {
      if (sb.updating || !q.length) return;
      try { sb.appendBuffer(q.shift()); } catch (e) { cleanup(); }
    };
    let trimAt = 0;
    sb.addEventListener('updateend', () => {
      const now = performance.now();
      if (now > trimAt && v.currentTime > 30 && !sb.updating) {
        trimAt = now + 10000;
        try { sb.remove(0, v.currentTime - 20); return; } catch (e) {}
      }
      pump();
    });
    const resp = await fetch('/live.mp4', {cache: 'no-store'});
    if (!resp.ok) throw new Error('stream ' + resp.status);
    const reader = resp.body.getReader();
    msg.textContent = '';
    let dead = false;
    function cleanup() { dead = true; try { reader.cancel(); } catch (e) {} }
    while (!dead && my === session) {
      const {value, done} = await reader.read();
      if (done) break;
      q.push(value);
      pump();
    }
  } catch (e) {
    msg.textContent = String(e.message || e);
  }
  if (my === session) setTimeout(play, 400);
}

// Stay near the live edge: jump if far behind, speed up slightly if a little behind.
setInterval(() => {
  if (!v.buffered.length) return;
  const end = v.buffered.end(v.buffered.length - 1);
  const lag = end - v.currentTime;
  lagEl.textContent = lag > 0 ? lag.toFixed(1) + 's buffer' : '';
  if (usingHls) { if (lag > 8) v.currentTime = end - 3; return; }
  if (lag > 0.6) v.currentTime = end - 0.1;
  v.playbackRate = lag > 0.25 ? 1.15 : 1.0;
  if (v.paused) v.play().catch(() => {});
}, 250);

document.getElementById('overlay').onclick = () => {
  startAudio();
  v.muted = false;
  v.play().catch(() => {});
  document.getElementById('overlay').style.display = 'none';
};

// ---- controls ----
async function cmd(c) {
  try {
    const r = await fetch('/api?c=' + encodeURIComponent(c), {cache: 'no-store'});
    const t = await r.text();
    try { st = JSON.parse(t); statusOkAt = performance.now(); render(); } catch (e) { msg.textContent = t; setTimeout(() => msg.textContent = '', 3000); }
  } catch (e) { msg.textContent = 'phone unreachable'; }
}

// ---- zoom and pan happen right here in the browser: instant and smooth, per viewer ----
const stageEl = document.getElementById('stage'), viewEl = document.getElementById('view');
const view = {s: 1, x: 0, y: 0};
function applyView(animate) {
  viewEl.style.transition = animate ? 'transform .2s ease-out' : 'none';
  viewEl.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
}
function clampView() {
  const r = stageEl.getBoundingClientRect();
  view.s = Math.max(1, Math.min(8, view.s));
  view.x = Math.min(0, Math.max(r.width * (1 - view.s), view.x));
  view.y = Math.min(0, Math.max(r.height * (1 - view.s), view.y));
}
function zoomAt(px, py, f, animate) {
  const ns = Math.max(1, Math.min(8, view.s * f));
  view.x = px - (px - view.x) * ns / view.s;
  view.y = py - (py - view.y) * ns / view.s;
  view.s = ns;
  clampView();
  applyView(animate);
}
function panBy(dx, dy, animate) { view.x += dx; view.y += dy; clampView(); applyView(animate); }
stageEl.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stageEl.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015)), false);
}, {passive: false});
const ptrs = new Map();
stageEl.addEventListener('pointerdown', e => {
  if (e.target.closest('#overlay')) return;
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  stageEl.setPointerCapture(e.pointerId);
});
stageEl.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  if (ptrs.size === 1) {
    panBy(e.clientX - p.x, e.clientY - p.y, false);
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const other = a === p ? b : a;
    const d0 = Math.hypot(p.x - other.x, p.y - other.y), d1 = Math.hypot(e.clientX - other.x, e.clientY - other.y);
    const r = stageEl.getBoundingClientRect();
    if (d0 > 10) zoomAt((e.clientX + other.x) / 2 - r.left, (e.clientY + other.y) / 2 - r.top, d1 / d0, false);
  }
  p.x = e.clientX; p.y = e.clientY;
});
for (const ev of ['pointerup', 'pointercancel']) stageEl.addEventListener(ev, e => ptrs.delete(e.pointerId));
window.addEventListener('resize', () => { clampView(); applyView(false); });

function action(name) {
  if (name.startsWith('nudge')) {   // "nudge DX DY": look that way by a quarter screen
    const [, dx, dy] = name.split(' ').map(Number), r = stageEl.getBoundingClientRect();
    return panBy(-dx * r.width, -dy * r.height, true);
  }
  const z = st.zoom || 1;
  switch (name) {
    case 'zoomin': { const r = stageEl.getBoundingClientRect(); return zoomAt(r.width / 2, r.height / 2, 1.4, true); }
    case 'zoomout': { const r = stageEl.getBoundingClientRect(); return zoomAt(r.width / 2, r.height / 2, 1 / 1.4, true); }
    case 'reset': view.s = 1; view.x = 0; view.y = 0; return applyView(true);
    case 'rotate': return cmd('rot ' + (((st.rot || 0) + 90) % 360));
    case 'brighter': return st.ae === 'auto' ? cmd('target ' + Math.min(0.8, (st.target || 0.4) + 0.06).toFixed(2))
                                             : cmd('ev ' + Math.min(12, (st.ev || 0) + 2));
    case 'darker': return st.ae === 'auto' ? cmd('target ' + Math.max(0.08, (st.target || 0.4) - 0.06).toFixed(2))
                                           : cmd('ev ' + Math.max(-12, (st.ev || 0) - 2));
    case 'mono': return cmd('mono ' + (st.mono ? 0 : 1));
    case 'night': return cmd('maxexp ' + ((st.maxExp || 125) > 130 ? 66 : 250));
    default: return cmd(name);
  }
}

document.querySelectorAll('button[data-c]').forEach(b => b.onclick = () => action(b.dataset.c));
document.querySelectorAll('button[data-cam]').forEach(b => b.onclick = () => {
  msg.textContent = 'switching camera';
  cmd('cam ' + b.dataset.cam);
});
const MICS = [1, 2, 4, 8, 16, 32, 64];
function micStep(d) {
  const i = Math.max(0, MICS.indexOf(st.micGain || 1));
  cmd('micgain ' + MICS[Math.max(0, Math.min(MICS.length - 1, i + d))]);
}
document.getElementById('mic-').onclick = () => micStep(-1);
document.getElementById('mic+').onclick = () => micStep(1);
const qualities = [[300, 'Low'], [600, 'Normal'], [1200, 'High'], [2500, 'Max']];
document.getElementById('q').onclick = () => {
  const i = qualities.findIndex(q => q[0] >= (st.bitrate || 600));
  cmd('bitrate ' + qualities[(i + 1) % qualities.length][0]);
};
document.getElementById('hide').onclick = () => document.body.classList.add('hide');
document.getElementById('stage').addEventListener('dblclick', () => document.body.classList.toggle('hide'));

const names = {'4': 'IR', '0': 'Main', '2': 'Wide', '3': 'Tele', '1': 'Front'};
function render() {
  document.getElementById('micv').textContent = (st.micGain || 1) + 'x';
  const qb = document.getElementById('q');
  if (qb && st.bitrate) {
    const q = qualities.find(q => q[0] >= st.bitrate) || qualities[qualities.length - 1];
    qb.textContent = `${q[1]} ${(st.bitrate / 1000).toFixed(1)} Mb/s`;
  }
  document.querySelectorAll('button[data-cam]').forEach(b => b.classList.toggle('on', b.dataset.cam === st.cam));
  document.getElementById('mono').classList.toggle('on', !!st.mono);
  document.getElementById('night').classList.toggle('on', (st.maxExp || 0) > 130);
  const fps = st.ae === 'cam' ? '' : ` · ${Math.min(st.fps, Math.floor(1000 / Math.max(1, st.exp)))} fps`;
  const ae = st.ae === 'cam' ? `camera auto, ev ${st.ev}` :
             `${st.ae} · ISO ${st.iso} · ${Math.round(st.exp)} ms · gain ${(+st.gain).toFixed(1)}x${fps}`;
  document.getElementById('stat').textContent =
    `${names[st.cam] || 'cam ' + st.cam} · ${ae} · zoom ${view.s.toFixed(1)}x · rot ${st.rot} · light ${(+st.brightness).toFixed(2)}`;
  const w = st.watchers || [], h = st.health || {};
  const who = w.length ? w.map(x => `${x.what} (.${x.ip.split('.').pop()})`).join(', ') : 'nobody';
  const hot = h.skin > 45 || h.battery > 42 || h.throttle >= 3;
  const temp = h.battery > 0 ? `battery ${h.battery.toFixed(0)}°C, body ${h.skin.toFixed(0)}°C` : 'temperature n/a';
  const power = h.level >= 0 ? `${h.level}% ${h.charging ? 'charging' : ''}` : '';
  document.getElementById('stat2').innerHTML =
    `Watching (${w.length}): ${esc(who)} · Phone: <span class="${hot ? 'bad' : ''}">${temp}${hot ? ' HOT' : ''}</span> · ` +
    `<span class="${h.level >= 0 && !h.charging ? 'bad' : ''}">${power}${h.level >= 0 && !h.charging ? ' NOT CHARGING' : ''}</span>`;
  phoneWarn = (hot ? 'PHONE HOT ' : '') + (h.level >= 0 && !h.charging ? 'NOT CHARGING' : '');
}

// ---- keyboard and TV remote ----
const TV = /[?&]tv=1/.test(location.search) || /web0s|webos|smarttv|netcast/i.test(navigator.userAgent);
if (TV) {
  document.body.classList.add('tv', 'hide');
  document.querySelector('#overlay span').textContent = 'Press OK for sound';
}
function soundFromGesture() {
  if (usingHls) return;
  startAudio();
  if (!TV) v.muted = false;
  document.getElementById('overlay').style.display = 'none';
}
// Moves focus to the nearest button in a direction (remote arrows in the TV menu).
function moveFocus(dir) {
  const btns = Array.prototype.filter.call(document.querySelectorAll('#bar button'), b => b.offsetParent && !b.disabled);
  const cur = btns.indexOf(document.activeElement) >= 0 ? document.activeElement : null;
  if (!cur) { if (btns.length) btns[0].focus(); return; }
  const c = cur.getBoundingClientRect(), cx = c.left + c.width / 2, cy = c.top + c.height / 2;
  let best = null, bestScore = Infinity;
  for (const b of btns) {
    if (b === cur) continue;
    const r = b.getBoundingClientRect(), x = r.left + r.width / 2 - cx, y = r.top + r.height / 2 - cy;
    const along = {left: -x, right: x, up: -y, down: y}[dir];
    const across = dir === 'left' || dir === 'right' ? Math.abs(y) : Math.abs(x);
    if (along <= 1) continue;
    const score = along + across * 3;
    if (score < bestScore) { bestScore = score; best = b; }
  }
  if (best) best.focus();
}
const camOrder = ['4', '0', '2', '3'];
document.addEventListener('keydown', e => {
  const key = e.key, code = e.keyCode;
  const dir = {ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down'}[key] ||
              {37: 'left', 39: 'right', 38: 'up', 40: 'down'}[code];
  if (TV) {
    soundFromGesture();   // any remote press counts as the "tap" browsers want before sound
    const menuOpen = !document.body.classList.contains('hide');
    const back = code === 461 || key === 'Escape' || key === 'Backspace' || key === 'GoBack';
    if (menuOpen) {
      if (dir) { e.preventDefault(); return moveFocus(dir); }
      if (back) { e.preventDefault(); document.body.classList.add('hide'); if (document.activeElement) document.activeElement.blur(); }
      return;   // OK/Enter clicks the focused button by itself
    }
    if (key === 'Enter' || code === 13) {
      e.preventDefault();
      document.body.classList.remove('hide');
      const first = document.querySelector('#bar button');
      if (first) first.focus();
      return;
    }
    if (back) { e.preventDefault(); window.close(); return; }
    if (dir) { e.preventDefault(); return action({left: 'nudge -0.25 0', right: 'nudge 0.25 0', up: 'nudge 0 -0.25', down: 'nudge 0 0.25'}[dir]); }
    if (code === 33 || key === 'PageUp') { e.preventDefault(); return action('zoomin'); }
    if (code === 34 || key === 'PageDown') { e.preventDefault(); return action('zoomout'); }
    if (code === 403) return document.getElementById('motion').click();
    if (code === 404) {
      const i = camOrder.indexOf(st.cam);
      return cmd('cam ' + camOrder[(i + 1) % camOrder.length]);
    }
    if (code === 405) return document.getElementById('amode').click();
    if (code === 406) return document.getElementById('asens').click();
    return;
  }
  const k = dir && {left: 'nudge -0.25 0', right: 'nudge 0.25 0', up: 'nudge 0 -0.25', down: 'nudge 0 0.25'}[dir];
  if (k && document.activeElement === document.body) { e.preventDefault(); return action(k); }
  if (key === '+' || key === '=') action('zoomin');
  if (key === '-') action('zoomout');
  if (key === 'h') document.body.classList.toggle('hide');
});

// ---- motion view: compare with the frame from ~0.5 s ago, on the GPU ----
// Frames are shrunk and blurred first so sensor grain doesn't light up; what's left is movement.
const motion = (() => {
  const canvas = document.getElementById('mc');
  const btn = document.getElementById('motion');
  const gl = canvas.getContext('webgl', {premultipliedAlpha: false, preserveDrawingBuffer: false});
  if (!gl) { btn.disabled = true; btn.title = 'WebGL not available'; return null; }
  const SW = 192, SH = 144, RING = 16, BACK_MS = 500;   // compare with the frame ~0.5 s ago
  let mode = 0, sens = 1.0;
  try { mode = +localStorage.getItem('motionMode') || 0; sens = +localStorage.getItem('motionSens') || 1.0; } catch (e) {}

  const vs = 'attribute vec2 p; varying vec2 uv; void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }';
  const blurFs = `precision mediump float; uniform sampler2D t; uniform vec2 px; varying vec2 uv;

    void main(){
      float d = abs(texture2D(now, uv).r - texture2D(old, uv).r);

      vec3 o = mode < 1.5 ? mix(c * 0.7, vec3(1.0, 0.15, 0.1), m * 0.85) : vec3(m) * vec3(1.0, 0.9, 0.8);

  const iirFs = `precision highp float; uniform sampler2D cur, prev; uniform float r; varying vec2 uv;

  const magFs = `precision highp float; uniform sampler2D vid, a, b; uniform float alpha; varying vec2 uv;
    void main(){ float band = texture2D(a, uv).r - texture2D(b, uv).r;

  // brightness = how fast, drawn over a dimmed picture.
  const flowFs = `precision highp float; uniform sampler2D vid, now, prev; uniform vec2 px; uniform float sens; varying vec2 uv;
    float I(sampler2D t, vec2 p){ return texture2D(t, p).r; }
    vec3 hsv(float h, float s, float v){ vec3 k = clamp(abs(mod(h*6.0 + vec3(0.,4.,2.), 6.) - 3.) - 1., 0., 1.); return v * mix(vec3(1.), k, s); }
    void main(){

        float iy = (I(now, p + vec2(0., px.y)) - I(now, p - vec2(0., px.y)) + I(prev, p + vec2(0., px.y)) - I(prev, p - vec2(0., px.y))) * 0.25;

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);

  const maskFs = `precision mediump float; uniform sampler2D now, old; uniform float sens; varying vec2 uv;
    void main(){ float d = abs(texture2D(now, uv).r - texture2D(old, uv).r);

    pass(maskProg, maskFb, MW, MH, () => {
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, ring[head].t);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, old.t);
      gl.uniform1i(gl.getUniformLocation(maskProg, 'now'), 1);
      gl.uniform1i(gl.getUniformLocation(maskProg, 'old'), 2);

  const copyFs = `precision mediump float; uniform sampler2D t; varying vec2 uv; void main(){ gl_FragColor = texture2D(t, uv); }`;
  const copy = prog(copyFs);
  let flowPrimed = false;

    const k = Math.min(st.width / vw, st.height / vh);

    canvas.style.left = Math.round((st.width - w) / 2) + 'px'; canvas.style.top = Math.round((st.height - h) / 2) + 'px';

    gl.uniform1i(gl.getUniformLocation(show, 'vid'), 0);
    gl.uniform1i(gl.getUniformLocation(show, 'now'), 1);

      lastVideoTime = t;

      pass(blur, curFb, SW, SH, () => {
        gl.uniform1i(gl.getUniformLocation(blur, 't'), 0);
        gl.uniform2f(gl.getUniformLocation(blur, 'px'), 1.5 / SW, 1.5 / SH);
      });

      const rB = evmPrimed ? 1 - Math.exp(-2 * Math.PI * LO_HZ * dt) : 1;
      const src = evmIdx, dst = 1 - evmIdx;

          gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, curSmall);
          gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, low[src].t);
          gl.uniform1i(gl.getUniformLocation(iir, 'cur'), 1);

      gl.uniform1i(gl.getUniformLocation(mag, 'vid'), 0);

      pass(blur, curFb, SW, SH, () => {
        gl.uniform1i(gl.getUniformLocation(blur, 't'), 0);
        gl.uniform2f(gl.getUniformLocation(blur, 'px'), 1.5 / SW, 1.5 / SH);
      });

        pass(copy, prevFb, SW, SH, () => {
          gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, curSmall);

    }
    pass(flow, null, canvas.width, canvas.height, () => {
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, vidTex);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, curSmall);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, prevSmall);
      gl.uniform1i(gl.getUniformLocation(flow, 'vid'), 0);
      gl.uniform1i(gl.getUniformLocation(flow, 'now'), 1);
      gl.uniform1i(gl.getUniformLocation(flow, 'prev'), 2);
      gl.uniform2f(gl.getUniformLocation(flow, 'px'), 1 / SW, 1 / SH);

})();

(() => {   // direction legend: same hue mapping as the flow shader (GL y is up)
  const c = document.getElementById('wheel').getContext('2d');
  for (let x = 0; x < 64; x++) for (let y = 0; y < 64; y++) {
    const dx = x - 32, dy = 32 - y, r = Math.hypot(dx, dy);
    if (r > 30) continue;
    const h = (Math.atan2(dy, dx) / (2 * Math.PI) + 0.5) * 360;
    c.fillStyle = `hsla(${h}, 100%, 50%, ${Math.min(1, r / 12)})`;
    c.fillRect(x, y, 1, 1);
  }
})();

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }

// ---- signal watchdog: impossible to miss when the picture stops ----
let statusOkAt = performance.now(), progressAt = performance.now(), lastCT = -1, lastEnd = -1, phoneWarn = '';
let lostBeepAt = 0;
const banner = document.getElementById('banner'), alarm = document.getElementById('alarm'), live = document.getElementById('live');
function ago(sec) { return sec < 90 ? Math.round(sec) + ' s' : Math.round(sec / 60) + ' min'; }
setInterval(() => {
  const now = performance.now();
  const end = v.buffered.length ? v.buffered.end(v.buffered.length - 1) : -1;
  if (v.currentTime > lastCT || end > lastEnd) progressAt = now;
  lastCT = v.currentTime; lastEnd = end;
  const stale = (now - progressAt) / 1000;
  const unreachable = (now - statusOkAt) / 1000 > 8;
  const camAge = unreachable ? 0 : (st.frameAgeMs || 0) / 1000;
  let problem = '', age = 0;
  if (playError) {
    banner.className = 'nosignal';
    banner.innerHTML = `CAN'T PLAY HERE<small>${esc(playError)}</small>`;
    alarm.className = 'nosignal';
    return;
  }
  if (stale > (usingHls ? 8 : 3)) { problem = unreachable ? 'PHONE UNREACHABLE' : 'NO SIGNAL'; age = stale; }
  else if (camAge > 3) { problem = 'CAMERA FROZEN'; age = camAge; }
  if (problem) {
    banner.className = 'nosignal';
    banner.innerHTML = `${problem}<small>last picture ${ago(age)} ago</small>`;
    alarm.className = 'nosignal';
    document.title = '\u26A0 ' + problem + ' - Babycam';
    live.innerHTML = '';
    if (audio.ctx && now - lostBeepAt > 10000) { lostBeepAt = now; beep(880, 0.25); setTimeout(() => beep(660, 0.3), 300); }
    return;
  }
  document.title = 'Babycam';
  const soundOn = now < audio.alertUntil;
  banner.className = soundOn ? 'sound' : '';
  banner.innerHTML = soundOn ? 'SOUND' : '';
  alarm.className = soundOn ? 'sound' : '';
  live.innerHTML = '&#9679; LIVE' + (unreachable ? ' <span class="warn">controls unreachable</span>' : '') +
    (phoneWarn ? ` <span class="warn">${phoneWarn}</span>` : '') +
    (now < audio.alertUntil ? ' <span style="color:#e08a00">SOUND now</span>'
      : audio.lastAlert ? ` <span style="color:#c90">last sound ${ago((now - audio.lastAlert) / 1000)} ago</span>` : '');
}, 250);

// ---- sound: boost, limiter, level meter, alerts, sound-activated mode ----
const VOLS = [1, 2, 4, 8, 16, 32, 64];
const SENS = [['low', 24], ['medium', 15], ['high', 9]];   // dB above the room's background noise
const audio = {ctx: null, vol: 0, mode: 'always', sens: 1, floor: -90, voxUntil: 0, alertUntil: 0, lastAlert: 0};
try {
  audio.vol = +localStorage.getItem('vol') || 0;
  audio.mode = localStorage.getItem('amode') || 'always';
  audio.sens = localStorage.getItem('asens') !== null ? +localStorage.getItem('asens') : 1;
} catch (e) {}
// LG webOS (and iOS HLS) give a Web Audio tap of the video pure silence, so there the video
// plays its own sound and the meter/alerts use the level the phone measures (/level).
function directSound() { return usingHls || TV; }
// TV (LG webOS): it plays no sound from the stream at all, so the TV is picture only; the
// meter and sound alerts still work from the level the phone measures.
function startAudio() {
  if (TV) { v.muted = true; startServerLevel(); return; }
  if (directSound()) { v.muted = false; v.volume = 1; startServerLevel(); return; }
  if (audio.ctx) { audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio.ctx = new AC();
  const src = audio.ctx.createMediaElementSource(v);
  audio.an = audio.ctx.createAnalyser();
  audio.an.fftSize = 2048;
  audio.buf = new Float32Array(audio.an.fftSize);
  audio.gain = audio.ctx.createGain();
  const lim = audio.ctx.createDynamicsCompressor();   // keeps a cry at 64x from blowing your ears
  lim.threshold.value = -20; lim.knee.value = 6; lim.ratio.value = 15; lim.attack.value = 0.003; lim.release.value = 0.3;
  src.connect(audio.an);
  src.connect(audio.gain);
  audio.gain.connect(lim);
  lim.connect(audio.ctx.destination);
  document.getElementById('meter').style.display = 'block';
}
function beep(freq, dur) {
  if (!audio.ctx) return;
  const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
  o.frequency.value = freq; g.gain.value = 0.15;
  o.connect(g); g.connect(audio.ctx.destination);
  o.start(); o.stop(audio.ctx.currentTime + dur);
}
function dbToPct(db) { return Math.max(0, Math.min(100, (db + 110) / 90 * 100)); }
// Alerts and the meter use the loudness measured on the phone (before any boost), so every
// screen agrees and the boosts don't change what counts as a sound.
let overCount = 0;
function onLevel(db) {
  const now = performance.now();
  const trig = Math.max(audio.floor + SENS[audio.sens][1], -80);
  overCount = db > trig ? overCount + 1 : 0;
  if (overCount >= 2) {             // about half a second above: a real sound, not a click
    audio.lastAlert = now;
    audio.alertUntil = now + 4000;
    audio.voxUntil = now + 10000;
  }
  // Background level: drops quickly, rises slowly (~40 s), and never learns from a sound.
  if (db < audio.floor) audio.floor += (db - audio.floor) * 0.2;
  else if (now > audio.alertUntil) audio.floor += (db - audio.floor) * 0.006;
  audio.floor = Math.max(audio.floor, -100);
  document.getElementById('meter').style.display = 'block';
  const fill = document.getElementById('meterFill');
  fill.style.height = dbToPct(db) + '%';
  fill.style.background = db > trig ? '#e08a00' : '#4c4';
  document.getElementById('meterFloor').style.bottom = dbToPct(audio.floor) + '%';
  document.getElementById('meterTrig').style.bottom = dbToPct(trig) + '%';
  const open = !(audio.mode === 'vox' && now > audio.voxUntil);
  if (audio.gain) audio.gain.gain.setTargetAtTime(open ? VOLS[audio.vol] : 0, audio.ctx.currentTime, 0.05);
  else if (directSound() && audio.started) v.muted = !open;
}
let levelPolling = false;
function startServerLevel() {
  if (directSound()) audio.started = true;
  if (levelPolling) return;
  levelPolling = true;
  (async function poll() {
    try {
      const r = await fetch('/level', {cache: 'no-store'});
      onLevel((await r.json()).db);
    } catch (e) {}
    setTimeout(poll, 250);
  })();
}
function renderAudio() {
  for (const id of ['vol-', 'volv', 'vol+']) document.getElementById(id).style.display = directSound() ? 'none' : '';
  document.getElementById('volv').textContent = VOLS[audio.vol] + 'x';
  document.getElementById('amode').textContent = audio.mode === 'vox' ? 'On sound only' : 'Always on';
  document.getElementById('amode').classList.toggle('on', audio.mode === 'vox');
  document.getElementById('asens').textContent = 'Alert: ' + SENS[audio.sens][0];
  try { localStorage.setItem('vol', audio.vol); localStorage.setItem('amode', audio.mode); localStorage.setItem('asens', audio.sens); } catch (e) {}
}
document.getElementById('vol-').onclick = () => { audio.vol = Math.max(0, audio.vol - 1); renderAudio(); };
document.getElementById('vol+').onclick = () => { audio.vol = Math.min(VOLS.length - 1, audio.vol + 1); renderAudio(); };
document.getElementById('amode').onclick = () => { audio.mode = audio.mode === 'vox' ? 'always' : 'vox'; renderAudio(); };
document.getElementById('asens').onclick = () => { audio.sens = (audio.sens + 1) % SENS.length; renderAudio(); };
renderAudio();

// Where the browser allows sound without a tap (kiosk Firefox, the TV app), start it right away.
setTimeout(() => {
  if (usingHls || playError) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const probe = new AC();
  const allowed = probe.state === 'running';
  probe.close();
  if (!allowed) return;
  startAudio();
  if (!TV) v.muted = false;
  const ov = document.getElementById('overlay');
  ov.querySelector('span').textContent = TV ? 'Picture only on this TV' : 'Sound on';
  setTimeout(() => { ov.style.display = 'none'; }, 1500);
}, 1500);

startServerLevel();
setInterval(() => cmd('status'), 2000);
cmd('status');
play();
</script>
</body>
</html>
